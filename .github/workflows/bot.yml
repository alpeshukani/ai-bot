name: AI Multi-Asset Bot

# Har ghante, ghante ke 5th minute par (1H candle close ke baad).
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}     # "Run workflow" button se manual test

concurrency:
  group: ai-multi-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # state + trades commit karne ke liye

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Check secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && echo "TELEGRAM_BOT_TOKEN: SET" || echo "TELEGRAM_BOT_TOKEN: MISSING"
          [ -n "$TELEGRAM_CHAT_ID" ] && echo "TELEGRAM_CHAT_ID: SET" || echo "TELEGRAM_CHAT_ID: MISSING"

      - name: Telegram test (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python algo_bot.py --test-telegram

      # PAPER MODE ONLY - koi live order nahi.
      - name: Run bot (paper)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python algo_bot.py --once --heartbeat --notify
          else
            python algo_bot.py --once --heartbeat
          fi

      - name: Save bot state
        run: |
          git config user.name "ai-multi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot_state.json bot_trades.csv
          if git diff --cached --quiet; then
            echo "State unchanged - kuch commit karne ko nahi."
            exit 0
          fi
          git commit -m "bot state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "state pushed (attempt $i)"
              exit 0
            fi
            echo "push attempt $i fail - 10s baad retry"
            sleep 10
          done
          echo "::error::state push 5 attempts ke baad bhi fail"
          exit 1
